# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=carbon-tracker

# H2 Database Configuration (Zero-setup for evaluation, can switch to MySQL/Postgres in 2 lines)
spring.datasource.url=jdbc:h2:mem:carbontrackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console for DB inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (256-bit secret key for HMAC-SHA256)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger / OpenAPI documentation path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
